name: Update GitHub Contribution Chart

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download contribution SVG
        run: |
          curl -s "https://ghchart.rshah.org/wheatBread1306" -o assets/github-chart.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-chart.svg
          if git diff --staged --quiet; then
            echo "No changes in chart"
          else
            git commit -m "chore: update github contribution chart [skip ci]"
            git push
          fi